<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Warranty360 – ניהול אחריות חכם</title>
    <meta
      name="description"
      content="Warranty360 – מערכת חכמה לניהול, מעקב ושירות אחריות עבור מוצרי חשמל וציוד, למוסדות וללקוחות פרטיים."
    />
    <script>
      // מניעת הבהוב (FOUC) - קביעת מצב כהה לפני הרינדור הראשון של React.
      try {
        var stored = JSON.parse(localStorage.getItem('warranty360-theme'));
        var theme = stored?.state?.theme;
        if (theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
